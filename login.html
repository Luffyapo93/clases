<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesion — Mi Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fondo decorativo -->
  <div class="bg-pattern"></div>
  <div class="dot-grid"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">B</div>
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresa a tu cuenta para continuar</p>
      </div>

      <form id="login-form" onsubmit="event.preventDefault(); Auth.login(this);">
        <div class="form-group">
          <label class="form-label" for="login-username">Usuario</label>
          <input type="text" class="form-input" id="login-username" placeholder="Tu nombre de usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contrasena</label>
          <input type="password" class="form-input" id="login-password" placeholder="Tu contrasena" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
          Iniciar sesion
        </button>
      </form>

      <div class="auth-divider">o</div>

      <div style="text-align: center; margin-bottom: 8px;">
        <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px;">Credenciales de prueba:</p>
        <code style="color: var(--text-secondary); font-size: 0.8rem; font-family: var(--font-mono);">admin / admin123</code>
      </div>

      <div class="auth-footer">
        No tienes una cuenta?
        <a href="register.html" style="margin-left: 4px;">Registrate</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Inicializar y redirigir si ya hay sesión
    App.init();
    Auth.redirectIfLoggedIn();
  </script>
</body>
</html>
